name: Project Quality Gate

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src/LongevityDiet.Web/package-lock.json
            tests/LongevityDiet.E2ETests/package-lock.json

      - name: Validate frozen project structure
        shell: pwsh
        run: ./scripts/Validate-ProjectStructure.ps1

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Restore .NET
        run: dotnet restore ./LongevityDiet.sln

      - name: Build .NET
        env:
          CI: "true"
        run: dotnet build ./LongevityDiet.sln -c Release --no-restore

      - name: Test .NET
        run: dotnet test ./LongevityDiet.sln -c Release --no-build

      - name: Install frontend dependencies
        working-directory: src/LongevityDiet.Web
        run: npm ci

      - name: Test frontend
        working-directory: src/LongevityDiet.Web
        run: npm test

      - name: Lint frontend
        working-directory: src/LongevityDiet.Web
        run: npm run lint

      - name: Build frontend
        working-directory: src/LongevityDiet.Web
        run: npm run build


  current-runtime-release-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/LongevityDiet.E2ETests/package-lock.json

      - name: Generate ephemeral runtime configuration
        shell: bash
        run: |
          python - <<'PY'
          import secrets
          from pathlib import Path
          sql = "Ci_" + secrets.token_urlsafe(30) + "_Aa1!"
          jwt = secrets.token_urlsafe(48)
          Path(".env").write_text(
              "MSSQL_SA_PASSWORD=" + sql + "\n"
              "JWT_SIGNING_KEY=" + jwt + "\n"
              "JWT_ISSUER=LongevityDiet.API\n"
              "JWT_AUDIENCE=LongevityDiet.Web\n"
              "SQLSERVER_PORT=14330\n"
              "REDIS_PORT=6379\n"
              "API_PORT=8080\n"
              "GRPC_PORT=8081\n"
              "WEB_PORT=5173\n",
              encoding="utf-8",
          )
          PY

      - name: Build and start current Compose runtime
        run: docker compose up -d --build

      - name: Wait for current runtime
        shell: bash
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null &&
               curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color --tail 200
          exit 1

      - name: Install Docker E2E dependencies
        working-directory: tests/LongevityDiet.E2ETests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Docker E2E
        working-directory: tests/LongevityDiet.E2ETests
        run: npm run test:docker

      - name: Current runtime evidence
        shell: bash
        run: |
          docker compose ps
          docker compose exec -T redis redis-cli ping
          docker compose exec -T redis redis-cli XINFO GROUPS longevity:weekly-report-events || true

      - name: Tear down release smoke
        if: always()
        run: docker compose down -v --remove-orphans
